<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ConnectNet - Painel</title>
    <style>
        :root {
            --primary: #007BFF; 
            --danger: #dc3545;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* Barra Superior (Header com Saudação e Logout) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary);
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button.btn-danger {
            background: var(--danger);
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        button.btn-danger:hover {
            background: #bd2130;
        }

        button.btn-logout {
            background: var(--danger);
        }

        button.btn-logout:hover {
            background: #bd2130;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee; 
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
        }

        tr:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR COM SAUDAÇÃO E BOTÃO DE SAIR -->
        <div class="top-bar">
            <h1>ConnectNet</h1>
            <div class="user-info">
                <span id="saudacao-usuario">Olá, Usuário</span>
                <button class="btn-logout" onclick="fazerLogout()">Sair</button>
            </div>
        </div>

        <!-- SEÇÃO DE CLIENTES -->
        <div class="card">
            <h2>Gerenciamento de Clientes</h2>
            <div class="form-grid">
                <input type="text" id="cli-nome" placeholder="Nome completo" required>
                <input type="email" id="cli-email" placeholder="E-mail" required>
                <input type="text" id="cli-telefone" placeholder="Telefone" required>
                <input type="text" id="cli-endereco" placeholder="Endereço" required>
                <input type="text" id="cli-status" placeholder="Status" value="ATIVO" required>
                <input type="number" id="cli-plano_id" placeholder="ID do Plano" value="1" required>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button id="btn-cadastrar" onclick="cadastrarCliente()">Cadastrar Cliente</button>
                <button id="btn-atualizar" onclick="atualizarCliente()" style="display: none; background: #ffc107; color: #333;">Salvar Alterações</button>
                <button id="btn-cancelar" onclick="cancelarEdicao()" style="display: none; background: #6c757d; color: white;">Cancelar</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Status</th>
                            <th>Plano ID</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SEÇÃO DE FATURAS -->
        <div class="card">
            <h2>Gerenciamento de Faturas</h2>
            <div class="form-grid">
                <input type="number" id="fat-cliente_id" placeholder="ID do Cliente">
                <input type="number" step="0.01" id="fat-valor" placeholder="Valor (R$)">
                <input type="date" id="fat-vencimento">
                <input type="text" id="fat-status" placeholder="Status (ex: PENDENTE)" value="PENDENTE">
            </div>
            <button onclick="cadastrarFatura()">Gerar Fatura</button>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente ID</th>
                            <th>Valor</th>
                            <th>Vencimento</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-faturas">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SEÇÃO DE CHAMADOS -->
        <div class="card">
            <h2>Gerenciamento de Chamados</h2>
            <div class="form-grid">
                <input type="number" id="cham-cliente_id" placeholder="ID do Cliente">
                <input type="text" id="cham-descricao" placeholder="Descrição do problema">
                <input type="text" id="cham-status" placeholder="Status (ex: ABERTO)" value="ABERTO">
                <input type="text" id="cham-prioridade" placeholder="Prioridade (ex: ALTA/MEDIA)" value="MEDIA">
            </div>
            <button onclick="cadastrarChamado()">Abrir Chamado</button>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente ID</th>
                            <th>Descrição</th>
                            <th>Abertura</th>
                            <th>Status</th>
                            <th>Prioridade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chamados">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // PROTEÇÃO DE ROTA (Se não estiver logado, volta para o login)
        if (!localStorage.getItem('usuarioLogado')) {
    window.location.href = 'login.html';
} else {
    // Exibe o nome do usuário logado na barra superior
    const nomeUsuario = localStorage.getItem('usuarioLogado');
    document.getElementById('saudacao-usuario').innerText = `Olá, ${nomeUsuario}`;
}

        // Função de Logout
        function fazerLogout() {
            localStorage.clear(); // Limpa os dados de sessão
            window.location.href = 'login.html'; // Redireciona para o login
        }

        const API_URL = 'http://localhost:3000';

        let clienteEditandoId = null;

        // CLIENTES
        async function carregarClientes() {
            const res = await fetch(`${API_URL}/clientes`);
            const dados = await res.json();
            const tbody = document.getElementById('tabela-clientes');
            tbody.innerHTML = '';
            dados.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.nome}</td>
                        <td>${c.email}</td>
                        <td>${c.telefone || ''}</td>
                        <td>${c.status}</td>
                        <td>${c.plano_id}</td>
                        <td>
                            <button onclick="preencherEdicao(${c.id}, '${c.nome}', '${c.email}', '${c.telefone || ''}', '${c.endereco || ''}', '${c.status}', ${c.plano_id})" style="background: #ffc107; color: #333; padding: 6px 10px; font-size: 0.8rem; margin-right: 5px;">Editar</button>
                            <button class="btn-danger" onclick="deletarCliente(${c.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function cadastrarCliente() {
            const nome = document.getElementById('cli-nome').value.trim();
            const email = document.getElementById('cli-email').value.trim();
            const telefone = document.getElementById('cli-telefone').value.trim();
            const endereco = document.getElementById('cli-endereco').value.trim();
            const status = document.getElementById('cli-status').value.trim();
            const plano_id = document.getElementById('cli-plano_id').value;

            // Validação para não deixar passar campos vazios
            if (!nome || !email || !telefone || !endereco || !status || !plano_id) {
                alert('Preencha todos os campos antes de cadastrar!');
                return;
            }

            const dados = { nome, email, telefone, endereco, status, plano_id: parseInt(plano_id) };

            const res = await fetch(`${API_URL}/clientes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const r = await res.json();
            alert(r.mensagem || r.erro);
            limparFormularioCliente();
            carregarClientes();
        }

        async function atualizarCliente() {
            if (!clienteEditandoId) return;

            const nome = document.getElementById('cli-nome').value.trim();
            const email = document.getElementById('cli-email').value.trim();
            const telefone = document.getElementById('cli-telefone').value.trim();
            const endereco = document.getElementById('cli-endereco').value.trim();
            const status = document.getElementById('cli-status').value.trim();
            const plano_id = document.getElementById('cli-plano_id').value;

            // Validação também na edição
            if (!nome || !email || !telefone || !endereco || !status || !plano_id) {
                alert('Preencha todos os campos antes de salvar!');
                return; 
            }

            const dados = { nome, email, telefone, endereco, status, plano_id: parseInt(plano_id) };

            const res = await fetch(`${API_URL}/clientes/${clienteEditandoId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const r = await res.json();
            alert(r.mensagem || r.erro);
            limparFormularioCliente();
            carregarClientes();
        }

        function cancelarEdicao() {
            limparFormularioCliente();
        }

        // FUNÇÃO PARA PREENCHER O FORMULÁRIO AO CLICAR EM EDITAR
        function preencherEdicao(id, nome, email, telefone, endereco, status, plano_id) {
            // Salva o ID do cliente que estamos editando na variável global
            clienteEditandoId = id;

            // Preenche os inputs com os dados do cliente
            document.getElementById('cli-nome').value = nome;
            document.getElementById('cli-email').value = email;
            document.getElementById('cli-telefone').value = telefone;
            document.getElementById('cli-endereco').value = endereco;
            document.getElementById('cli-status').value = status;
            document.getElementById('cli-plano_id').value = plano_id;

            // Esconde o botão de Cadastrar e mostra os botões de Atualizar e Cancelar
            document.getElementById('btn-cadastrar').style.display = 'none';
            document.getElementById('btn-atualizar').style.display = 'inline-block';
            document.getElementById('btn-cancelar').style.display = 'inline-block';
        }

        function limparFormularioCliente() {
            clienteEditandoId = null;
            document.getElementById('cli-nome').value = '';
            document.getElementById('cli-email').value = '';
            document.getElementById('cli-telefone').value = '';
            document.getElementById('cli-endereco').value = '';
            document.getElementById('cli-status').value = 'ATIVO';
            document.getElementById('cli-plano_id').value = '1';

            // Restaura os botões ao estado original
            document.getElementById('btn-cadastrar').style.display = 'inline-block';
            document.getElementById('btn-atualizar').style.display = 'none';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        async function deletarCliente(id) {
            if (confirm('Deseja realmente excluir este cliente?')) {
                await fetch(`${API_URL}/clientes/${id}`, { method: 'DELETE' });
                carregarClientes();
            }
        }

        // FATURAS
        async function carregarFaturas() {
            const res = await fetch(`${API_URL}/faturas`);
            const dados = await res.json();
            const tbody = document.getElementById('tabela-faturas');
            tbody.innerHTML = '';
            dados.forEach(f => {
                const dataFmt = f.data_vencimento ? f.data_vencimento.split('T')[0] : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${f.id}</td>
                        <td>${f.cliente_id}</td>
                        <td>R$ ${Number(f.valor).toFixed(2)}</td>
                        <td>${dataFmt}</td>
                        <td>${f.status}</td>
                        <td><button class="btn-danger" onclick="deletarFatura(${f.id})">Excluir</button></td>
                    </tr>
                `;
            });
        }

        async function cadastrarFatura() {
            const dados = {
                cliente_id: parseInt(document.getElementById('fat-cliente_id').value),
                valor: parseFloat(document.getElementById('fat-valor').value),
                data_vencimento: document.getElementById('fat-vencimento').value,
                status: document.getElementById('fat-status').value
            };
            const res = await fetch(`${API_URL}/faturas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const r = await res.json();
            alert(r.mensagem || r.erro);
            carregarFaturas();
        }

        async function deletarFatura(id) {
            if (confirm('Deseja realmente excluir esta fatura?')) {
                await fetch(`${API_URL}/faturas/${id}`, { method: 'DELETE' });
                carregarFaturas();
            }
        }

        // CHAMADOS
        async function carregarChamados() {
            const res = await fetch(`${API_URL}/chamados`);
            const dados = await res.json();
            const tbody = document.getElementById('tabela-chamados');
            tbody.innerHTML = '';
            dados.forEach(ch => {
                const dataAbertura = ch.data_abertura ? ch.data_abertura.split('T')[0] : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${ch.id}</td>
                        <td>${ch.cliente_id}</td>
                        <td>${ch.descricao}</td>
                        <td>${dataAbertura}</td>
                        <td>${ch.status}</td>
                        <td>${ch.prioridade}</td>
                        <td><button class="btn-danger" onclick="deletarChamado(${ch.id})">Excluir</button></td>
                    </tr>
                `;
            });
        }

        async function cadastrarChamado() {
            const dados = {
                cliente_id: parseInt(document.getElementById('cham-cliente_id').value),
                descricao: document.getElementById('cham-descricao').value,
                status: document.getElementById('cham-status').value,
                prioridade: document.getElementById('cham-prioridade').value
            };
            const res = await fetch(`${API_URL}/chamados`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const r = await res.json();
            alert(r.mensagem || r.erro);
            carregarChamados();
        }

        async function deletarChamado(id) {
            if (confirm('Deseja realmente excluir este chamado?')) {
                await fetch(`${API_URL}/chamados/${id}`, { method: 'DELETE' });
                carregarChamados();
            }
        }

        // Carregar tudo ao abrir
        carregarClientes();
        carregarFaturas();
        carregarChamados();
    </script>
</body>
</html>
