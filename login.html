<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - ConnectNet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #007BFF;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        button:hover {
            background: #0056b3;
        }
        #erro-msg {
            color: #dc3545;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ConnectNet</h2>
        <form id="form-login">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="teste@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="******">
            </div>
            <button type="submit">Entrar</button>
            <p id="erro-msg"></p>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroMsg = document.getElementById('erro-msg');

            erroMsg.textContent = '';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (res.ok) {
                    // Salva que o usuário está logado e vai para o painel principal (index.html)
                    localStorage.setItem('usuarioLogado', data.usuario);
                    window.location.href = 'index.html';
                } else {
                    erroMsg.textContent = data.erro || 'Erro ao fazer login.';
                }
            } catch (err) {
                erroMsg.textContent = 'Não foi possível conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
